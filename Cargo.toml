[workspace]
members = ["crates/aeolus", "crates/boreas", "crates/anemoi-sandbox"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smattymatty/Anemoi"
authors = ["Mathew Storm"]

# Bevy system signatures are long by nature; every other clippy lint is an error in CI.
[workspace.lints.clippy]
type_complexity = "allow"
