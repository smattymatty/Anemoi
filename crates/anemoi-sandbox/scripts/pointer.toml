# The pointer path: a cell aimed through the camera, a click, a Travel there.
frames = 30
budget_ms = { startup = 8000, max_frame = 300 }   # loose, as in walk.toml

[[at]]
frame = 5
cursor_at = [2, 3]
note = "the cursor rests on (2,3); nothing moves yet"
expect = { cursor = "at=(680,304)", intent = "clicks=travel travel=none", sim = "player=(0,0)" }

[[at]]
frame = 10
mouse_press = true
note = "click_cell turns the screen point back into (2,3)"
expect = { intent = "travel=(2,3)" }

[[at]]
frame = 11
mouse_release = true

[[at]]
frame = 20
shot = true
expect = { sim = "player=(2,3) turn=5", intent = "travel=none", cursor = "at=(680,304)" }
