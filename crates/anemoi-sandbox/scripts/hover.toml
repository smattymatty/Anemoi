# The hover outline: it follows the pointer onto grid cells, and only those.
frames = 30
budget_ms = { startup = 8000, max_frame = 300 }   # loose, as in walk.toml

[[at]]
frame = 3
note = "no pointer yet: no hover, no target"
expect = { outline = "hover=none target=none" }

[[at]]
frame = 5
cursor_at = [2, 3]
shot = true
note = "the outline sits on (2,3)"
expect = { outline = "hover=(2,3) target=none", sim = "player=(0,0) turn=0" }

[[at]]
frame = 10
cursor_at = [7, 7]
expect = { outline = "hover=(7,7)" }

[[at]]
frame = 15
cursor_at = [8, 7]
note = "one past the east edge of the 8x8 grid"
expect = { outline = "hover=none" }

[[at]]
frame = 20
cursor_at = [-3, -2]
shot = true
note = "off the grid: no outline"
expect = { outline = "hover=none", cursor = "at=(600,384)" }

[[at]]
frame = 25
cursor_at = [0, 0]
note = "hovering never moves the Unit"
expect = { outline = "hover=(0,0)", sim = "player=(0,0) turn=0" }
