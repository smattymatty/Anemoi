# A held key walks; a click Travels one Step per frame and stops on arrival.
frames = 40
budget_ms = { startup = 30000, max_frame = 300 }  # startup: CI lavapipe cold start hit 15.3 s; max_frame is the gate

[[at]]
frame = 5
press = ["W"]

[[at]]
frame = 7
release = ["W"]
expect = { sim = "player=(0,2) turn=2" }

[[at]]
frame = 20
click_tile = [2, 3]
note = "the first Step goes this frame"
expect = { sim = "player=(0,3)", intent = "travel=(2,3)" }

[[at]]
frame = 30
shot = true
expect = { sim = "player=(2,3) turn=5", intent = "travel=none", pace = "locked=false" }
